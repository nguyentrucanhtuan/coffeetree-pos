services:
  db:
    image: postgres:16
    container_name: coffeetree-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: coffeetree
      POSTGRES_PASSWORD: coffeetree
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - coffeetree-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeetree"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV LANG=C.UTF-8
        ENV DEBIAN_FRONTEND=noninteractive

        # Cài hệ thống dependencies
        RUN apt-get update && apt-get install -y --no-install-recommends \
            git curl wget gnupg npm node-less \
            libpq-dev postgresql-client \
            gcc g++ libxml2-dev libxslt1-dev libjpeg-dev \
            libffi-dev libldap2-dev libsasl2-dev libssl-dev \
            fonts-noto-cjk libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 \
            && rm -rf /var/lib/apt/lists/*

        # wkhtmltopdf (xuất PDF)
        RUN wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.bookworm_amd64.deb \
            && dpkg -i wkhtmltox_0.12.6.1-3.bookworm_amd64.deb || apt-get install -fy \
            && rm wkhtmltox_0.12.6.1-3.bookworm_amd64.deb \
            && rm -rf /var/lib/apt/lists/*

        RUN npm install -g rtlcss

        # Clone source từ GitHub (dùng đường dẫn mặc định /opt/odoo để tương thích với các bản upgrade)
        RUN git clone https://github.com/nguyentrucanhtuan/coffeetree-pos.git \
            --branch 19.0 --depth 1 /opt/odoo

        RUN pip install --no-cache-dir --upgrade pip \
            && pip install --no-cache-dir -r /opt/odoo/requirements.txt

        RUN mkdir -p /var/lib/odoo /mnt/custom_addons

        # Entrypoint: restore từ SQL dump (pos-data.sql) hoặc fallback init demo data
        RUN printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'echo "Waiting for database..."' \
            'until pg_isready -h db -U coffeetree -q; do sleep 2; done' \
            'echo "Database ready."' \
            '' \
            'DB=$(psql postgresql://coffeetree:coffeetree@db:5432/postgres -tAc "SELECT 1 FROM pg_database WHERE datname='"'"'coffeetree'"'"'" 2>/dev/null || echo "")' \
            'if [ "$DB" != "1" ]; then' \
            '    DATA_URL="https://raw.githubusercontent.com/nguyentrucanhtuan/coffeetree-pos/19.0/install/pos-data.sql"' \
            '    echo "Checking for pos-data.sql..."' \
            '    HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$DATA_URL")' \
            '    if [ "$HTTP_STATUS" = "200" ]; then' \
            '        echo "Found pos-data.sql — restoring database..."' \
            '        psql postgresql://coffeetree:coffeetree@db:5432/postgres -c "CREATE DATABASE coffeetree OWNER coffeetree;" 2>/dev/null || true' \
            '        curl -fsSL "$DATA_URL" | psql postgresql://coffeetree:coffeetree@db:5432/coffeetree' \
            '        echo "Database restored from pos-data.sql!"' \
            '    else' \
            '        echo "No pos-data.sql found — initializing with demo data (~5 min)..."' \
            '        /opt/odoo/odoo-bin \' \
            '            --db_host=db --db_port=5432 --db_user=coffeetree --db_password=coffeetree \' \
            '            -d coffeetree --init=base --without-demo=False \' \
            '            --addons-path=/opt/odoo/addons,/mnt/custom_addons \' \
            '            --data-dir=/var/lib/odoo --stop-after-init' \
            '        echo "Database initialized with demo data!"' \
            '    fi' \
            'fi' \
            '' \
            'echo "Starting CoffeeTree POS at http://localhost:8069 ..."' \
            'exec /opt/odoo/odoo-bin \' \
            '    --db_host=db --db_port=5432 --db_user=coffeetree --db_password=coffeetree \' \
            '    -d coffeetree \' \
            '    --addons-path=/opt/odoo/addons,/mnt/custom_addons \' \
            '    --data-dir=/var/lib/odoo' \
            > /entrypoint.sh && chmod +x /entrypoint.sh

        EXPOSE 8069 8072
        ENTRYPOINT ["/entrypoint.sh"]

    container_name: coffeetree-pos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - coffeetree-net

volumes:
  db-data:
  odoo-data:

networks:
  coffeetree-net:
    driver: bridge
